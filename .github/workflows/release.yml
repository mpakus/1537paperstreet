# Tag vX.Y.Z (or workflow_dispatch) builds three release packages:
# a universal macOS app and DMG, a Linux .deb, and a Windows NSIS installer.
# macOS is signed and notarized. Linux and Windows packages are unsigned.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_tag:
        description: Optional existing tag to attach the DMG to (e.g. v0.1.0). Leave empty to only upload workflow artifacts.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '12.0'

jobs:
  release-macos:
    runs-on: macos-14
    timeout-minutes: 180
    env:
      APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain
        run: rustup show

      - name: Add macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-universal-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - run: npm ci

      - name: SDK for x86_64 cross-compile
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Prepare Apple signing credentials
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?set repository secret MACOS_CERTIFICATE_BASE64}"
          : "${APPLE_CERTIFICATE_PASSWORD:?set repository secret MACOS_CERTIFICATE_PASSWORD}"
          : "${APPLE_SIGNING_IDENTITY:?set repository secret DEVELOPER_ID_APPLICATION}"
          : "${APPLE_API_KEY_BASE64:?set repository secret APPLE_API_KEY_BASE64}"
          : "${APPLE_API_KEY:?set repository secret APPLE_API_KEY_ID}"
          : "${APPLE_API_ISSUER:?set repository secret APPLE_API_ISSUER}"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize universal .app and DMG
        run: npm run tauri -- build --target universal-apple-darwin --bundles app,dmg

      - name: Notarize and staple DMG
        run: |
          set -euo pipefail
          dmg=(target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [[ "${#dmg[@]}" -ne 1 || ! -f "${dmg[0]}" ]]; then
            echo "expected exactly one DMG" >&2
            exit 1
          fi
          notary_ok=0
          for attempt in 1 2 3 4 5; do
            echo "notarytool submit --wait attempt ${attempt}"
            if xcrun notarytool submit "${dmg[0]}" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --wait \
              --timeout 1800; then
              notary_ok=1
              break
            fi
            echo "notarytool wait failed; retrying in 20 seconds..." >&2
            sleep 20
          done
          if [[ "$notary_ok" -ne 1 ]]; then
            echo "DMG notarization did not finish after five attempts" >&2
            exit 1
          fi
          xcrun stapler staple "${dmg[0]}"

      - name: Verify universal, signed, notarized distribution
        run: |
          app="target/universal-apple-darwin/release/bundle/macos/1537paperstreet.app"
          bin="$app/Contents/MacOS/1537paperstreet"
          dmg=(target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          bash scripts/verify-universal.sh "$bin"
          bash scripts/verify-macos-distribution.sh "$app" "${dmg[0]}"

      - name: Collect artifacts
        id: artifacts
        env:
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${PUBLISH_TAG:-}" ]]; then
            version="${PUBLISH_TAG#v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          dmg="$(echo target/universal-apple-darwin/release/bundle/dmg/*.dmg)"
          if [[ ! -f "$dmg" ]]; then
            echo "DMG not found under target/universal-apple-darwin/release/bundle/dmg/" >&2
            ls -la target/universal-apple-darwin/release/bundle/dmg/ >&2 || true
            exit 1
          fi
          zip_name="1537paperstreet-${version}-macos-universal.zip"
          ditto -c -k --keepParent \
            target/universal-apple-darwin/release/bundle/macos/1537paperstreet.app \
            "$zip_name"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "zip=$zip_name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: macos-universal
          path: |
            ${{ steps.artifacts.outputs.dmg }}
            ${{ steps.artifacts.outputs.zip }}

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.publish_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.publish_tag }}
          VERSION: ${{ steps.artifacts.outputs.version }}
          DMG: ${{ steps.artifacts.outputs.dmg }}
          ZIP: ${{ steps.artifacts.outputs.zip }}
        run: bash scripts/publish-release.sh --edit-notes "$TAG" "$VERSION" "$DMG" "$ZIP"

      - name: Remove App Store Connect API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"

  release-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-linux-${{ hashFiles('Cargo.lock') }}

      - run: npm ci

      - name: Build .deb
        run: npm run tauri -- build --bundles deb

      - name: Collect artifacts
        id: artifacts
        env:
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${PUBLISH_TAG:-}" ]]; then
            version="${PUBLISH_TAG#v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          deb=(target/release/bundle/deb/*.deb)
          if [[ "${#deb[@]}" -ne 1 || ! -f "${deb[0]}" ]]; then
            echo "expected exactly one .deb" >&2
            ls -la target/release/bundle/deb/ >&2 || true
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "deb=${deb[0]}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: linux-deb
          path: ${{ steps.artifacts.outputs.deb }}

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.publish_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.publish_tag }}
          VERSION: ${{ steps.artifacts.outputs.version }}
          DEB: ${{ steps.artifacts.outputs.deb }}
        run: bash scripts/publish-release.sh "$TAG" "$VERSION" "$DEB"

  release-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-windows-${{ hashFiles('Cargo.lock') }}

      - run: npm ci

      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Collect artifacts
        id: artifacts
        env:
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${PUBLISH_TAG:-}" ]]; then
            version="${PUBLISH_TAG#v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          setup=(target/release/bundle/nsis/*-setup.exe)
          if [[ "${#setup[@]}" -ne 1 || ! -f "${setup[0]}" ]]; then
            echo "expected exactly one NSIS installer" >&2
            ls -la target/release/bundle/nsis/ >&2 || true
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "setup=${setup[0]}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-nsis
          path: ${{ steps.artifacts.outputs.setup }}

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.publish_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.publish_tag }}
          VERSION: ${{ steps.artifacts.outputs.version }}
          SETUP: ${{ steps.artifacts.outputs.setup }}
        run: bash scripts/publish-release.sh "$TAG" "$VERSION" "$SETUP"
