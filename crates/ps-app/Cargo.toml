[package]
name = "ps-app"
version = "0.13.1"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "1537paperstreet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
ps-core = { version = "0.13.1", path = "../ps-core" }
ps-render = { version = "0.13.1", path = "../ps-render" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2.4.2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-window-state = "2.4.1"
sha2 = "0.10.9"
# native-tls must be passed to AgentBuilder::tls_connector. The feature
# alone does not enable HTTPS (and rustls/ring is not allowed by cargo-deny).
ureq = { version = "2.12.1", default-features = false, features = ["gzip", "native-tls"] }
window-vibrancy = "0.6.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-core-foundation = { version = "0.3.2", features = ["CFRunLoop", "CFDate"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGImage",
    "CGPDFPage",
] }
objc2-foundation = "0.3.2"
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "PDFDocument",
    "PDFPage",
    "objc2-core-graphics",
] }
# Encodes PDF page bitmaps. PDFKit draws the page; this writes the PNG.
png = "0.18"
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "WKPDFConfiguration",
    "WKWebView",
    "WKWebViewConfiguration",
] }

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
