[package]
name = "ps-render"
version = "0.12.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ammonia = "~4.1.8"
blake3 = "1.8.6"
ps-core = { version = "0.12.0", path = "../ps-core" }
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "html", "regex-fancy"] }
two-face = { version = "0.4.3", default-features = false, features = ["syntect-fancy"] }
thiserror = "2.0.20"

[dev-dependencies]
serde_json = "1.0.151"
criterion = "0.8.2"
insta = { version = "1.48.0", default-features = false }
tempfile = "3.27.0"

[[bench]]
name = "render"
harness = false
