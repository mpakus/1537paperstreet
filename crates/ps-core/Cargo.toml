[package]
name = "ps-core"
version = "0.7.6"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
nucleo = "0.5.0"
notify = "8.2.0"
blake3 = "1.8.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting"] }
trash = { version = "5.2.6", default-features = false }
ts-rs = "12.0.1"
ulid = "3.0.0"
unicode-normalization = "0.1.25"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"
tempfile = "3.27.0"

[[bench]]
name = "projects_search"
harness = false

[[bench]]
name = "tree_read_dir"
harness = false
