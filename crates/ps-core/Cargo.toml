[package]
name = "ps-core"
version = "0.12.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
redb = "4.4.0"
# The 0.11.5 maintenance release supports our scrypt-only format without the
# vulnerable crypto-bigint dependency pulled in by 0.12.1's P-256 recipients.
age = { version = "=0.11.5", default-features = false }
tempfile = "3.27.0"
zeroize = "1"
same-file = "1.0.6"
nucleo = "0.5.0"
regex = "1.11"
notify = "8.2.0"
blake3 = "1.8.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["serialize", "deserialize"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting"] }
trash = { version = "5.2.6", default-features = false, features = ["coinit_apartmentthreaded"] }
ts-rs = "12.0.1"
ulid = "3.0.0"
unicode-normalization = "0.1.25"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"

[[bench]]
name = "projects_search"
harness = false

[[bench]]
name = "tree_read_dir"
harness = false
