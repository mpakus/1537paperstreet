[workspace]
members = ["crates/ps-app", "crates/ps-core", "crates/ps-render"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.97.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Host proc-macro libraries must retain the symbols rustc loads at build time.
[profile.release.build-override]
strip = "none"
